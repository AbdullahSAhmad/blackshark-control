# WirePlumber 0.5+: same rule as 51-blackshark-softvol.lua (which is for 0.4).
# Razer BlackShark V2 Pro: ignore the dongle's hardware volume control and let
# PipeWire scale the audio in software, the same in analog and digital mode.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "~alsa_card.usb-1532_Razer_BlackShark_V2_Pro.*" } ]
    actions = { update-props = { api.alsa.soft-mixer = true } }
  }
]
